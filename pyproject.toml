[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soundblaster-x-g6-cli"
dynamic = ["version"]  # single source: g6_cli.VERSION
description = "Control and read back the SoundBlaster X G6 from the command line or a GUI (Linux and Windows)"
readme = { file = "doc/python.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
# Based on the original soundblaster-x-g6-cli by Nils Skowasch (GPL-2.0).
authors = [{ name = "Nils Skowasch" }]
dependencies = [
    "hidapi>=0.14",
    "pyusb>=1.3.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
keywords = ["SoundBlaster X G6", "Creative", "USB HID", "CLI"]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
test = ["pytest>=8"]

[project.scripts]
soundblaster-x-g6-cli = "g6_cli:cli_entry"
g6 = "g6_cli:cli_entry"
g6-probe = "g6_cli.g6_probe:cli_entry"

[project.gui-scripts]
soundblaster-x-g6-gui = "g6_cli.gui:main"

[tool.setuptools.dynamic]
version = { attr = "g6_cli.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["*_test.py", "test_*.py"]
addopts = "-ra -m 'not hardware'"
markers = [
    "hardware: talks to a real, connected G6 (run explicitly with: pytest -m hardware)",
]
