[package]
name = "g6-cli"
version = "1.1.0"
description = "Command line control for the Sound BlasterX G6; a port of the Python soundblaster-x-g6-cli."
edition.workspace = true
license = "GPL-2.0-only"
publish = false
rust-version.workspace = true

[[bin]]
name = "g6"
path = "src/main.rs"

[dependencies]
g6-proto = { path = "../g6-proto" }
g6-device = { path = "../g6-device" }
clap.workspace = true

[dev-dependencies]
serde_json.workspace = true
