name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test (no hardware)
        run: python -m pytest
      - name: CLI smoke (dry run, no device)
        run: |
          python -m g6_cli --version
          python -m g6_cli --dry-run --set-output Headphones --lighting-volume-ring Enabled
